name: Build HW Mods

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hw-essentials:
    name: Build and test HW Essentials
    runs-on: ubuntu-latest

    steps:
      - name: Check out HW-Mods
        uses: actions/checkout@v4

      - name: Check out HW-CodaLoader (for API)
        uses: actions/checkout@v4
        with:
          repository: HowlingWhispers/HW-CodaLoader
          path: HW-CodaLoader

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build HW Essentials
        env:
          HW_CODALOADER_API_DIR: ${{ github.workspace }}/HW-CodaLoader/src/main/java
        run: ./scripts/build-hw-essentials.sh

      - name: Test HW Essentials
        env:
          HW_CODALOADER_API_DIR: ${{ github.workspace }}/HW-CodaLoader/src/main/java
        run: ./scripts/test-hw-essentials.sh

      - name: Verify mod metadata
        shell: bash
        run: |
          MOD_JAR=$(find dist -name 'hw-essentials-*.jar' -print -quit)
          unzip -l "$MOD_JAR" | grep -F "coda.mod.json"
          unzip -p "$MOD_JAR" coda.mod.json | jq -e '.id == "hw_essentials" and .version == "0.2.0" and .minecraft == "26.4-snapshot-3"'

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: hw-essentials-${{ github.sha }}
          path: |
            dist/hw-essentials-0.2.0.jar
            dist/hw-essentials-0.2.0.jar.sha256
          if-no-files-found: error
          retention-days: 30

  publish-hw-essentials:
    name: Publish HW Essentials release
    needs: build-hw-essentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out HW-Mods
        uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: hw-essentials-${{ github.sha }}
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MOD_JAR="dist/hw-essentials-0.2.0.jar"
          SHA256="$(cat dist/hw-essentials-0.2.0.jar.sha256 | awk '{print $1}')"
          TAG="v0.2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; bump the version for a new build." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # HW Essentials 0.2.0

          CML-native utility mod for **Minecraft Java 26.4 Snapshot 3**.

          Commands:
          - `/sethome [name]` — Save your current position and facing. Defaults to `home`.
          - `/home [name]` — Return to that home, after checking the landing spot.
          - `/back` — Return to the departure point of your last successful home or return trip, with landing checks.
          - `/homes` — List your homes in this world.
          - `/delhome <name>` — Delete a home.
          - `/hwessentials` — Version and command help.

          Return points are session-only and isolated per world and player. Refused trips preserve them. Restarting Minecraft clears return points; saved homes remain intact.

          Ten home slots by default. Names allow 1–32 letters, numbers, underscores and hyphens; case is normalized.
          Set `max-homes=1..100` in `config/hw_essentials/essentials.properties` and restart Minecraft to change the limit.

          Homes are stored inside the active world at `cml/hw-essentials/homes/<player UUID>.properties`.
          Each world and player has separate homes. Writes use atomic replacement; corrupt files are left intact and reported rather than reset.

          Requires CodaLoader 0.0.19+ (includes the Coda command API and server-thread bridge).
          This mod JAR is installed automatically by CodaLoader into the active game profile, including CodaLauncher-managed profiles.
          Existing homes, settings, and manually modified conflicting mod files are preserved.
          EOF
          gh release create "$TAG" "$MOD_JAR" "dist/hw-essentials-0.2.0.jar.sha256" \
            --target "$GITHUB_SHA" --title "HW Essentials 0.2.0" \
            --notes-file release-notes.md --prerelease