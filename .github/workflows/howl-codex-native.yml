name: Codex native Snapshot 3 API probe
on:
  push:
    paths:
      - 'mods/howl-codex/**'
      - '.github/workflows/howl-codex-native.yml'
  pull_request:
    paths:
      - 'mods/howl-codex/**'
      - '.github/workflows/howl-codex-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify EXACT Mojang Snapshot 3 named client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native
          curl -fsSL --retry 3 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o native/manifest.json
          VERSION_URL="$(jq -r '.versions[] | select(.id == "26.4-snapshot-3") | .url' native/manifest.json)"
          test -n "$VERSION_URL"
          curl -fsSL --retry 3 "$VERSION_URL" -o native/version.json
          CLIENT_URL="$(jq -r '.downloads.client.url' native/version.json)"
          SHA1="$(jq -r '.downloads.client.sha1' native/version.json)"
          curl -fsSL --retry 3 "$CLIENT_URL" -o native/client.jar
          test "$(sha1sum native/client.jar | cut -d' ' -f1)" = "$SHA1"
          echo "Verified Mojang 26.4 Snapshot 3 $SHA1"
      - name: Verify Codex native GUI and item registry descriptors
        shell: bash
        run: |
          set -euo pipefail
          CP=native/client.jar
          check() {
            local cls="$1" expected="$2"
            echo "===== $cls ($expected) ====="
            javap -p -classpath "$CP" "$cls" | tee "native/$(echo "$cls" | tr '.$' '__').txt"
            grep -F "$expected" "native/$(echo "$cls" | tr '.$' '__').txt"
          }
          check net.minecraft.client.gui.components.Button 'builder('
          check 'net.minecraft.client.gui.components.Button$Builder' 'bounds('
          check net.minecraft.client.gui.components.EditBox 'setResponder('
          check net.minecraft.client.gui.components.EditBox 'setValue('
          check net.minecraft.client.gui.screens.Screen 'addRenderableWidget('
          check net.minecraft.client.gui.screens.Screen 'children('
          check net.minecraft.client.gui.screens.inventory.InventoryScreen 'InventoryScreen('
          check net.minecraft.core.registries.BuiltInRegistries 'ITEM;'
          check net.minecraft.world.item.ItemStack 'getHoverName('
          check net.minecraft.client.gui.screens.recipebook.RecipeBookComponent 'toggleVisibility('
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-native-snapshot3-descriptors
          path: native/*.txt
          retention-days: 14
