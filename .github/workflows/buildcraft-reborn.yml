name: BuildCraft Reborn source verification

on:
  push:
    branches: [main]
    paths:
      - 'projects/buildcraft-reborn/**'
      - '.github/workflows/buildcraft-reborn.yml'
  pull_request:
    paths:
      - 'projects/buildcraft-reborn/**'
      - '.github/workflows/buildcraft-reborn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bcce-original:
    name: Verify original BCCE 8.0.23 source and isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fresh source project from upstream
        run: bash projects/buildcraft-reborn/scripts/prepare-source.sh
      - name: Set up Java 25 for exact Minecraft Snapshot 3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile and test BCCE's original travelling-item scheduler
        run: bash projects/buildcraft-reborn/scripts/test-original-flow-core.sh
      - name: Compile original BCCE item transfer API against real Minecraft 26.4
        run: bash projects/buildcraft-reborn/scripts/test-original-item-api.sh
      - name: Compile native Snapshot 3 block sound-set compatibility
        run: |
          set -euo pipefail
          mkdir -p dist/buildcraft-reborn/sound-api-test
          javac --release 25 -encoding UTF-8 \
            -cp dist/buildcraft-reborn/mojang-26.4-snapshot-3/client.jar \
            -d dist/buildcraft-reborn/sound-api-test \
            projects/buildcraft-reborn/tests/OriginalBlockSoundSetApiTest.java
          javap -classpath dist/buildcraft-reborn/sound-api-test \
            OriginalBlockSoundSetApiTest | grep -F 'originalStoneProperties'
          echo "PASS: Minecraft 26.4 BlockSoundSet and key-based stone/metal sound mappings compile."
      - name: Validate original pipe compilation probe shell syntax
        run: bash -n projects/buildcraft-reborn/scripts/probe-original-pipe-compilation.sh
      - name: Stage BCCE original pipe holders with capability/model import adapters
        run: python3 projects/buildcraft-reborn/scripts/stage-original-pipe-holders.py
      - name: Probe exact pipe holder compiler blockers against Snapshot 3
        run: bash projects/buildcraft-reborn/scripts/probe-original-pipe-compilation.sh
      - name: Compile H.O.W.L. BCCE capability and model-data boundaries against real Mojang API
        run: |
          set -euo pipefail
          CLASS_DIR="dist/buildcraft-reborn/compat-tests"
          mkdir -p "$CLASS_DIR"
          MC_CACHE="dist/buildcraft-reborn/mojang-26.4-snapshot-3"
          NATIVE_CP="$MC_CACHE/client.jar"
          while IFS= read -r jar; do NATIVE_CP="$NATIVE_CP:$jar"; done < <(
            find "$MC_CACHE/libraries" dist/buildcraft-reborn/test-deps \
              -name '*.jar' -type f | sort
          )
          STAGED_SRC="dist/buildcraft-reborn/staged-snapshot3/src/main/java"
          ORIGINAL_SRC="dist/buildcraft-reborn/effective-1.21.11-neoforge/src/main/java"
          javac --release 25 -encoding UTF-8 \
            -cp "$NATIVE_CP" \
            -d "$CLASS_DIR" \
            "$STAGED_SRC/buildcraft/lib/internal/capabilities/IBCCapabilityProvider.java" \
            "$ORIGINAL_SRC/buildcraft/api/v2/OperationMode.java" \
            "$ORIGINAL_SRC/buildcraft/api/v2/item/ItemMatcher.java" \
            "$ORIGINAL_SRC/buildcraft/api/v2/item/ItemPort.java" \
            "$ORIGINAL_SRC/buildcraft/api/v2/item/ItemTransferPolicy.java" \
            "$ORIGINAL_SRC/buildcraft/api/v2/item/ItemTransferResult.java" \
            projects/buildcraft-reborn/bridge/src/main/java/buildcraft/lib/compat/howl/*.java \
            projects/buildcraft-reborn/tests/NativeCapabilityModelDataTest.java \
            projects/buildcraft-reborn/tests/NativeContainerItemPortTest.java
          java -cp "$CLASS_DIR:$NATIVE_CP" NativeCapabilityModelDataTest
          java -cp "$CLASS_DIR:$NATIVE_CP" NativeContainerItemPortTest
          javap -classpath "$CLASS_DIR" \
            buildcraft.lib.compat.howl.OriginalCapabilityLookup |
            grep -F 'get(net.minecraft.world.level.Level, net.minecraft.core.BlockPos'
      - name: Upload full original BCCE compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-reborn-original-pipe-compiler-report
          path: |
            dist/buildcraft-reborn/pipe-holder-compiler-report.txt
            dist/buildcraft-reborn/pipe-holder-javac-errors.txt
            dist/buildcraft-reborn/staged-snapshot3/ADAPTATIONS.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm no old BuildCraft build or release is active
        run: |
          test ! -e mods/buildcraft-cml
          test ! -e scripts/build-buildcraft-cml.sh
          test ! -e dist/buildcraft-cml-0.1.0-dev.jar
          test ! -e projects/buildcraft-reborn/resources/coda.mod.json
          echo 'PASS: no old prototype, no playable BuildCraft artifact and no release publisher.'
