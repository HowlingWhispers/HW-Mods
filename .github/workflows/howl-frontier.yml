name: Build, test and publish Frontier
on:
  push:
    branches: [main, feature/frontier-camp]
    paths: ['mods/howl-frontier/**', 'mods/frontier-mods.json', 'scripts/build-howl-frontier.sh', '.github/workflows/howl-frontier.yml', 'scripts/check-frontier-release-version.py']
  pull_request:
    paths: ['mods/howl-frontier/**', 'mods/frontier-mods.json', 'scripts/build-howl-frontier.sh', '.github/workflows/howl-frontier.yml', 'scripts/check-frontier-release-version.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HowlingWhispers/HW-CodaLoader
          ref: b2e8682ff0141f1c1f3b24b53219bf3ea6252ed8
          path: build-loader
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build matching runtime and verify its real native settlement primitives
        working-directory: build-loader
        run: |
          bash scripts/build-dist.sh
          bash scripts/test-essentials.sh
          python3 scripts/fetch-snapshot-test-runtime.py out/frontier-minecraft
          bash scripts/test-living-world-native.sh out/frontier-minecraft/client.jar out/frontier-minecraft/libraries
      - name: Build and test Frontier against that exact API
        env:
          HW_CODALOADER_API_DIR: ${{ github.workspace }}/build-loader/src/main/java
        run: bash scripts/build-howl-frontier.sh
      - name: Verify full loader/mod initialization and profile opt-in
        run: |
          set -euo pipefail
          mkdir -p out/frontier-profile/mods out/frontier-profile/config
          cp mods/howl-frontier/dist/howl-frontier-*.jar out/frontier-profile/mods/
          printf 'frontier\n' > out/frontier-profile/config/howl-play-mode.txt
          java -jar build-loader/dist/CodaLoader.jar --loader-only out/frontier-profile > out/frontier-init.log
          VERSION="$(python3 -c 'import json;print(json.load(open("mods/howl-frontier/resources/coda.mod.json"))["version"])')"
          grep -F "[Frontier] ${VERSION}, mode=Frontier, H.O.W.L. 0.0.45" out/frontier-init.log
          test -f out/frontier-profile/mods/hw-essentials.jar
          test -f out/frontier-profile/mods/coda-wolf-0.1.0-dev.jar
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-${{ github.sha }}
          path: mods/howl-frontier/dist/*
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontier-${{ github.sha }}
          path: dist/frontier
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify published runtime prerequisite and immutable mod release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.0.45 --repo HowlingWhispers/HW-CodaLoader
          mkdir -p runtime-check
          gh release download v0.0.45 --repo HowlingWhispers/HW-CodaLoader --pattern CodaLoader-v0.0.45-win64.zip --pattern update-manifest.json --dir runtime-check
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('runtime-check')
          m=json.loads((root/'update-manifest.json').read_text())
          assert m['version']=='0.0.45' and m['bundle']=='CodaLoader-v0.0.45-win64.zip'
          archive=root/m['bundle']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==m['sha256']
          with zipfile.ZipFile(archive) as z: jar=z.read('CodaLoader.jar')
          assert hashlib.sha256(jar).hexdigest()==m['files']['CodaLoader.jar']
          (root/'CodaLoader.jar').write_bytes(jar)
          with zipfile.ZipFile(root/'CodaLoader.jar') as z:
              assert 'dev/howlingwhispers/codaloader/api/CodaLivingWorld.class' in z.namelist()
              assert 'dev/howlingwhispers/codaloader/api/CodaBlockTarget.class' in z.namelist()
              assert 'dev/howlingwhispers/codaloader/bootstrap/MinecraftLivingWorld.class' in z.namelist()
              assert 'dev/howlingwhispers/codaloader/bootstrap/CodaSettlerAvatarTransformer.class' in z.namelist()
              assert 'dev/howlingwhispers/codaloader/bootstrap/CodaSettlerAvatarLifecycle.class' in z.namelist()
              assert json.loads(z.read('codaloader/runtime-version.json'))=={'version':'0.0.45','minecraft':'26.4-snapshot-3'}
          print('PASS: published runtime archive, inner JAR, compatibility classes and exact version verified')
          PYCODE
          mkdir -p runtime-check/profile/mods runtime-check/profile/config
          cp dist/frontier/*.jar runtime-check/profile/mods/
          printf 'frontier\n' > runtime-check/profile/config/howl-play-mode.txt
          java -jar runtime-check/CodaLoader.jar --loader-only runtime-check/profile > runtime-check/init.log
          VERSION="$(python3 -c 'import json;print(json.load(open("mods/howl-frontier/resources/coda.mod.json"))["version"])')"
          grep -F "[Frontier] ${VERSION}, mode=Frontier, H.O.W.L. 0.0.45" runtime-check/init.log
          TAG="frontier-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Published Frontier versions are immutable.'
            exit 0
          fi
          gh api --paginate --slurp repos/HowlingWhispers/HW-Mods/releases > frontier-published-releases.json
          python3 scripts/check-frontier-release-version.py "$VERSION" frontier-published-releases.json
          (cd dist/frontier && sha256sum --check howl-frontier-*.sha256)
          NOTES_FILE=mods/howl-frontier/RELEASE_NOTES.md
          head -n1 "$NOTES_FILE" | grep -F "Frontier ${VERSION}" || { echo "$NOTES_FILE must start with the notes for Frontier ${VERSION}" >&2; exit 1; }
          cp "$NOTES_FILE" frontier-release.md
          gh release create "$TAG" dist/frontier/* --draft --prerelease --target "$GITHUB_SHA" --title "H.O.W.L. Frontier ${VERSION}" --notes-file frontier-release.md
          gh release edit "$TAG" --draft=false
